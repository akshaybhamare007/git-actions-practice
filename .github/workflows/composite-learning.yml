name: composite-learning

on:
  push:
    branches:
      - main
  workflow_dispatch:

  
jobs:
  test-composite:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: greeting user
        id: greeting
        uses: ./.github/actions/greeting
        with:
          name: "Akshay"

      - name: consume greeting output
        env:
          GREETING: ${{steps.greeting.outputs.greeting}}
        run: echo "Received output from composite action:$GREETING"


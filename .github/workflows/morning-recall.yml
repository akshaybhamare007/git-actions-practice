name: gha-output-learning

on:
  push:
    branches: [main, dev]

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: create application
        id: metadata
        run: echo "app_name=sample-api" >> "$GITHUB_OUTPUT"  

    outputs:
      app_name: ${{steps.metadata.outputs.app_name}} 



  build:
    runs-on: ubuntu-latest
    needs: prepare    

    steps:
      - name: build app
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env: 
          APP_NAME: ${{needs.prepare.outputs.app_name}}
        run: echo "Building $APP_NAME"

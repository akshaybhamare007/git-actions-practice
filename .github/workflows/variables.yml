name: variables-learning

on:
  push:
    branches: [main]

  workflow_dispatch:

env:
  global_variable: global

jobs: 
  variable-learning:
    runs-on: ubuntu-latest

    env:
      job_variable: job

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: print step level variable
        env: 
          steps_variable: step
        run: echo "this is step level variable:, "$steps_variable" "  

      - name: print job level variable
        run: echo "this is job level variable:, "$job_variable" "  

      - name: print workflow level variable
        run: echo "this is workflow level variable:, "$global_variable" "

      - name: print configuration variable
        run: echo "Hello Akki, this step shows config variable, ${{vars.PROJECT_ID}}"    

      - name: print metadata variable
        run: |
          echo "Repository_Name is: $GITHUB_REPOSITORY"

      - name: gha-secrets-learning
        run: |
          echo "my first secret, ${{secrets.MY_KEY}}"          

name: learning- if- statement

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
      - name: Testing application
        run: echo "Testing application"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checking code quality
        run: echo "Checking code quality"  

      - name: Run only on main
        if: github.ref = "/refs/heads/main"
        run: echo "we are inside main"

      - name: Run only outside main
        if: github.ref != 'refs/heads/main'  
        run: echo "we are not on main"

      - name: Simulate failure
        run: exit 1  

      - name: Success handler
        if: success()
        run: echo "everything successful"

      - name: Failure handler
        if: failure()
        run: echo "preciding step failed"

      - name: Final Report
        if: always()
        run: echo "Reporting the final outcome"    
  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Building application
        run: echo "Building application"               

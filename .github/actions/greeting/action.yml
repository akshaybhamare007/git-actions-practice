name: Greeting Composite Action
description: A simple reusable greeting action

inputs:
  name:
    description: Name to greet
    required: false
    default: CI/CD learner

outputs:
  greeting:
    description: The greeting generated by this action
    value: $ {{steps.create-greeting.outputs.greeting}}    


runs:
  using: composite
  steps:
    - name: Validate input
      id: validate-input
      shell: bash
      env:
        INPUT_NAME: ${{ inputs.name }}
      run: |
        if [[ -z "$INPUT_NAME" ]]; then
          echo "Error: input 'name' must not be empty." >&2
          exit 1
        fi

        echo "validated_name=$INPUT_NAME" >> "$GITHUB_OUTPUT"
        echo "Input validation passed."

    - name: Create greeting
      id: create-greeting
      shell: bash
      env:
        GREETING_NAME: ${{ steps.validate-input.outputs.validated_name }}
      run: |
        greeting="Hello, ${GREETING_NAME}!"
        echo "greeting=$greeting" >> "$GITHUB_OUTPUT"
        echo "$greeting"

    - name: Confirm completion
      shell: bash
      run: echo "Greeting generation completed."


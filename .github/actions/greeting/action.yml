name: Greeting Composite Action
description: A simple reusable greeting action

inputs:
  name:
    description: Name to greet
    required: false
    default: CI/CD learner

outputs:
  greeting:
    description: The greeting generated by this action
    value: ${{steps.create-greeting.outputs.greeting}}    

runs:
  using: composite
  steps:
    - name: Print greeting
      id: create-greeting
      shell: bash
      env:
        GREETING_NAME: ${{ inputs.name }}
      run: |
        if [[ -z "$GREETING_NAME" ]]; then
          echo "Error: input 'name' must not be empty." >&2
          exit 1
        fi

        greeting="Hello, ${GREETING_NAME}!"
        echo "greeting=$greeting" >> "$GITHUB_OUTPUT"
        echo "$greeting"
